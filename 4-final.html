<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎂 Спасибо, мама!</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(145deg, #ffe4d6, #ffd9c0);
        }
        
        .final {
            text-align: center;
        }
        
        .balloons {
            font-size: 3rem;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            animation: float 3s infinite ease-in-out;
        }
        
        @keyframes float {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        
        h1 {
            font-size: 3.5rem;
            color: #b36b6b;
            font-weight: 800;
            margin-bottom: 30px;
            line-height: 1.3;
        }
        
        .message {
            font-size: 2rem;
            color: #9e6b6b;
            margin: 40px 0;
            font-style: italic;
        }
        
        .love {
            font-size: 4rem;
            color: #c48b8b;
            margin: 30px 0;
            animation: heartbeat 1.5s infinite;
        }
        
        @keyframes heartbeat {
            0%,100% { transform: scale(1); }
            30% { transform: scale(1.2); }
            60% { transform: scale(1.1); }
        }
        
        .hope {
            background: rgba(255, 235, 225, 0.7);
            border-radius: 60px;
            padding: 35px;
            margin: 40px 0;
            font-size: 1.6rem;
            color: #8b5a5a;
            border: 3px dashed #d9b0b0;
        }
        
        .again-btn {
            background: rgba(255, 255, 255, 0.5);
            color: #b28b8b;
            border: 2px solid #e6b3b3;
            padding: 15px 40px;
            font-size: 1.1rem;
            border-radius: 50px;
            margin-top: 30px;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }
        
        .again-btn:hover {
            background: rgba(255, 230, 230, 0.8);
            color: #b36b6b;
            border-color: #b36b6b;
            transform: scale(1.05);
        }
        
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .love { font-size: 3rem; }
            .hope { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="final">
            <div class="balloons">
                🎂 🎈 🎉 🎊 🎁
            </div>
            
            <h1>
                МАМА, <span class="insert-name">СВЕТА</span>!
            </h1>
            
            <div class="love">
                ❤️ Я ТЕБЯ ЛЮБЛЮ ❤️
            </div>
            
            <div class="message">
                С днём рождения, родная!
            </div>
            
            <div class="hope">
                💝 Это был мой подарок тебе 💝
                <br><br>
                Надеюсь, тебе понравилось...
            </div>
            
            <div style="font-size: 1.5rem; color: #b28b8b; margin: 30px 0;">
                Твой Серёжа ❤️
                <br>
                14 февраля 2026
            </div>
            
            <button class="again-btn" id="againBtn">
                🔄 Пройти заново
            </button>
        </div>
    </div>
    
    <script>
        document.getElementById('againBtn').addEventListener('click', function() {
            localStorage.removeItem('momName');
            this.style.transform = 'scale(0.95)';
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 500);
        });
        
        // Конфетти при загрузке
        function createConfetti() {
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.style.position = 'fixed';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.top = -20 + 'px';
                    confetti.style.width = (Math.random() * 10 + 5) + 'px';
                    confetti.style.height = (Math.random() * 10 + 5) + 'px';
                    confetti.style.background = ['#ffb3b3', '#ffd9b3', '#ffe5b3', '#ffb3d9'][Math.floor(Math.random() * 4)];
                    confetti.style.borderRadius = '50%';
                    confetti.style.pointerEvents = 'none';
                    confetti.style.zIndex = '9999';
                    confetti.style.animation = `fall ${Math.random() * 2 + 2}s linear forwards`;
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 4000);
                }, i * 30);
            }
        }
        
        // Добавляем анимацию падения
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fall {
                to { transform: translateY(100vh) rotate(360deg); }
            }
        `;
        document.head.appendChild(style);
        
        // Запускаем конфетти
        setTimeout(createConfetti, 500);
    </script>
    
    <script src="js/script.js"></script>
</body>
</html>
